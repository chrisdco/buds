# Runs everything that doesn't need a device or secrets:
#   - check: typecheck, lint, unit tests
#   - db:    spin up the Supabase local stack, apply migrations, run smoke.sql
# Kept fast for many small PRs: PRs only (main gets what its PRs already
# passed), a newer push cancels the older run, node_modules is cached on
# the lockfile, and db only runs when the schema side changed.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - "supabase/**"
              - "src/types/supabase.ts"
              - ".github/workflows/ci.yml"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Whole node_modules keyed on the lockfile: a hit skips npm ci (~25s).
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
        env:
          # supabaseClient throws without these; harmless dummies for unit tests
          # (no test in the suite hits the network).
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  # Brings up the full Supabase local stack (the migrations need the auth,
  # realtime, and pg_cron objects a bare Postgres lacks), applies all
  # migrations, and runs the RPC smoke test. ubuntu-latest ships Docker.
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # 2.117+: `gen types --local` runs without an access token (2.106
          # demands `supabase login` even for local generation, which CI
          # cannot provide). Keep in sync with local `npx supabase --version`.
          version: 2.117.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A fresh stack applies every migration on start (there is no seed
      # file), so no separate db reset.
      - name: Start stack + apply migrations
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,storage-api,realtime
      - name: Run SQL smoke test
        # ON_ERROR_STOP makes the RAISE EXCEPTION inside smoke.sql fail the job;
        # smoke.sql wraps in BEGIN/ROLLBACK so nothing persists. Container name
        # comes from project_id="buds" in supabase/config.toml.
        run: docker exec -i supabase_db_buds psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/smoke.sql
      - name: Generated types drift check
        # The checked-in client contract (src/types/supabase.ts) must match the
        # migrated schema: regenerate against the reset stack and fail on any
        # diff, so a migration without `npm run gen:types` breaks here.
        # Regenerate with the npm script (cmd redirect keeps LF/UTF-8);
        # PowerShell `>` writes UTF-16 and will trip this diff — don't.
        run: |
          supabase gen types typescript --local > /tmp/supabase.gen.ts
          diff -u src/types/supabase.ts /tmp/supabase.gen.ts
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
