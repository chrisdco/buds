# Runs the checks that don't need a device or secrets: typecheck, lint, unit
# tests. The SQL smoke test (supabase/tests/smoke.sql) needs a Postgres
# container and is run locally; see issue tracker for a follow-up CI job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
        env:
          # supabaseClient throws without these; harmless dummies for unit tests
          # (no test in the suite hits the network).
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
