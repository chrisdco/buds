# Runs everything that doesn't need a device or secrets:
#   - check: typecheck, lint, unit tests
#   - db:    spin up the Supabase local stack, apply migrations, run smoke.sql
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
        env:
          # supabaseClient throws without these; harmless dummies for unit tests
          # (no test in the suite hits the network).
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  # Brings up the full Supabase local stack (the migrations need the auth,
  # realtime, and pg_cron objects a bare Postgres lacks), applies all
  # migrations, and runs the RPC smoke test. ubuntu-latest ships Docker.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.106.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start stack + apply migrations
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,storage-api,realtime
      - name: Reset DB (re-apply all migrations, no seed)
        run: supabase db reset --no-seed
      - name: Run SQL smoke test
        # ON_ERROR_STOP makes the RAISE EXCEPTION inside smoke.sql fail the job;
        # smoke.sql wraps in BEGIN/ROLLBACK so nothing persists. Container name
        # comes from project_id="buds" in supabase/config.toml.
        run: docker exec -i supabase_db_buds psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/smoke.sql
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
