# Buds smoke: launch, room creation (name asked at create), live map.
# Prereqs: fresh install (no display name yet), permissions granted and a
# mock location set. suite.yml does all of that; see docs/e2e.md.
appId: com.buds.app
---
- launchApp
- assertVisible: "Where to?"
- tapOn:
    id: "home-create"
- assertVisible: "Choose a mode"
- tapOn:
    id: "create-your-name"
- inputText: "Maestro"
- hideKeyboard
- tapOn:
    id: "create-submit"
# The room sheet: its header carries invite + settings.
- extendedWaitUntil:
    visible:
      id: "room-invite"
    timeout: 15000
