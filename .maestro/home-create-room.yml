# Buds smoke: launch, room creation (name asked at create), live map.
# Prereqs (see docs/e2e.md): emulator booted, supabase running, Metro up,
# location + notification permissions pre-granted, mock location set,
# fresh install (no display name yet).
appId: com.buds.app
---
- launchApp
- assertVisible: "Where to?"
- tapOn:
    id: "home-create"
- assertVisible: "Choose a mode"
- tapOn:
    id: "create-your-name"
- inputText: "Maestro"
- hideKeyboard
- tapOn:
    id: "create-submit"
# The room sheet: its header carries invite + settings.
- assertVisible:
    id: "room-invite"
    timeout: 15000
