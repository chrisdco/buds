# Buds smoke: launch, room creation (name asked at create), live map.
# Prereqs: fresh install (no display name yet), permissions granted and a
# mock location set. suite.yml does all of that; see docs/e2e.md.
appId: com.buds.app
---
# No relaunch: tabs.yml leaves us on Home, and a cold start on the CI
# emulator is slow. Run on its own, open the app first.
- extendedWaitUntil:
    visible: "Where to?"
    timeout: 60000
- tapOn:
    id: "home-create"
- assertVisible: "Choose a mode"
- tapOn:
    id: "create-your-name"
- inputText: "Maestro"
# No hideKeyboard: on a keyboard-less emulator it presses Back and leaves
# the screen. What's tapped next stays above the keyboard anyway.
- tapOn:
    id: "create-submit"
# The room sheet: its header carries invite + settings.
- extendedWaitUntil:
    visible:
      id: "room-invite"
    timeout: 15000
