# Bottom tabs: Home / Trips / Profile render, switch, and keep their content.
# Room/create/join stay full-screen (no tab bar over the map).
appId: com.buds.app
---
- launchApp
# A slow emulator can show a system "isn't responding" dialog over the app.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# Cold start (fonts, session, splash) is slow on a GPU-less CI emulator.
- extendedWaitUntil:
    visible: "Where to?"
    timeout: 60000
- assertVisible:
    id: "tab-trips"
- tapOn:
    id: "tab-trips"
- assertVisible: "Past"
- tapOn:
    id: "tab-profile"
- assertVisible: "Your name"
- assertVisible: "Settings"
- tapOn:
    id: "tab-home"
- assertVisible: "Where to?"
# A For-you preset opens /create preselected (Meet up = converge).
- tapOn:
    id: "trips-template-meet-up"
- assertVisible: "Meet up trip"
- tapOn:
    id: "nav-back"
- assertVisible: "Where to?"
