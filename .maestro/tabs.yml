# Bottom tabs: Home / Trips / Profile render, switch, and keep their content.
# Room/create/join stay full-screen (no tab bar over the map).
appId: com.buds.app
---
- launchApp
- assertVisible: "Where to?"
- assertVisible:
    id: "tab-trips"
- tapOn:
    id: "tab-trips"
- assertVisible: "Past"
- tapOn:
    id: "tab-profile"
- assertVisible: "Preferences"
- assertVisible: "Settings"
- tapOn:
    id: "tab-home"
- assertVisible: "Where to?"
# A For-you preset opens /create preselected (Meet up = converge).
- tapOn:
    id: "trips-template-meet-up"
- assertVisible: "Meet up trip"
- tapOn:
    id: "nav-back"
- assertVisible: "Where to?"
