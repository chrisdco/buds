# Destination + route: long-press the map, confirm, expect route UI.
# Assumes the app is already inside a room as host (see suite.yml order).
# Map points are percent-of-screen (1080x2400 Pixel). With only you on the
# map the camera centers you at zoom 15, so 30% from the top is ~400 m away:
# far enough that the CTA is Navigate, not "I'm here".
appId: com.buds.app
---
# Not launchApp: a relaunch reopens on Home, not the room.
- runFlow: in-room.yml
# Long-press seeds adjust-pin mode; confirm opens the host-only sheet.
- longPressOn:
    point: "50%,30%"
- assertVisible: "Drag the map to fine-tune the pin"
- tapOn:
    id: "adjust-confirm"
- assertVisible: "Set room destination?"
- tapOn:
    id: "confirm-ok"
# Route reconciliation fetches the road route; the pinned CTA becomes Navigate.
- extendedWaitUntil:
    visible:
      id: "room-cta-navigate"
    timeout: 30000
