# Member sheet + follow: open own card, follow, verify focus chip, unfollow.
# Assumes an active room with at least self positioned (mock location set).
appId: com.buds.app
---
- launchApp
# Open member detail via your own row in the sheet list.
- tapOn: "Maestro \(you\)"
- assertVisible: "Follow on map"
# Follow pins the camera and shows the focus chip back on the map.
- tapOn:
    id: "member-follow"
- assertVisible: "Following Maestro"
# Re-center releases focus.
- tapOn:
    id: "room-recenter"
- assertNotVisible: "Following Maestro"
