# Member focus: from the detail screen, from a long-press, and clearing it.
# Assumes an active room with at least self positioned (mock location set).
appId: com.buds.app
---
# Not launchApp: a relaunch reopens on Home, not the room.
- runFlow: in-room.yml
# Detail screen -> Focus on map shows the Focus chip back on the map.
# The row itself (opens details), not its face, which toggles route focus.
- tapOn:
    id: "member-card-.*"
- extendedWaitUntil:
    visible: "Focus on map"
    timeout: 10000
- tapOn:
    id: "member-follow"
- assertVisible:
    id: "lens-focus"
# Re-center releases focus.
- tapOn:
    id: "room-recenter"
- assertNotVisible:
    id: "lens-focus"
# Long-press your row -> member menu -> Only them.
- longPressOn: 'Maestro \(you\)'
- assertVisible:
    id: "member-actions"
- tapOn: "Only them"
- assertVisible:
    id: "lens-focus"
# The Focus chip's x clears it again.
- tapOn:
    id: "lens-focus"
- assertNotVisible:
    id: "lens-focus"
